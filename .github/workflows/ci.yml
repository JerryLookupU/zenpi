name: zenpi CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zenpi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # search/find run the real rg (tests/stage1_search.rs requires it).
      # ripgrep 14 under-reports `stats.searches` with `--sort path`, so use
      # the same 15.x release as development rather than apt's 14.
      - name: Install ripgrep 15
        run: |
          curl -fsSL -o /tmp/rg.tar.gz \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/rg.tar.gz -C /tmp
          sudo install /tmp/ripgrep-15.0.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          rg --version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        # Several integration fixtures bind short-lived loopback listeners;
        # serial execution avoids OS-level port/resource contention while
        # retaining the complete all-targets matrix. `--all-features` includes
        # `remote`, which the remote suites (tests/remote_*.rs) require.
        run: cargo test --all-targets --all-features --locked --no-fail-fast -- --test-threads=1

      - name: Validate authoritative blueprint and Gantt
        run: |
          python3 tools/test_validate_blueprint_v2.py
          python3 tools/validate_blueprint_v2.py
          python3 tools/generate_blueprint_v2_gantt.py --check

      - name: Report Rust source inventory
        run: python3 tools/check_rust_loc.py

      - name: Run runtime and size budget gate
        id: runtime_budget
        shell: bash
        env:
          BUDGET_EVIDENCE_DIR: ${{ runner.temp }}/zenpi-runtime-budget-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir "$BUDGET_EVIDENCE_DIR"
          set +e
          python3 tools/bench_runtime.py --samples 3 \
            --output "$BUDGET_EVIDENCE_DIR/summary.json" \
            --startup-evidence-dir "$BUDGET_EVIDENCE_DIR/startup" \
            2>&1 | tee "$BUDGET_EVIDENCE_DIR/budget.log"
          budget_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${budget_status[0]}" > "$BUDGET_EVIDENCE_DIR/exit-code.txt"
          if [ "${budget_status[0]}" -ne 0 ]; then
            exit "${budget_status[0]}"
          fi
          exit "${budget_status[1]}"

      - name: Upload runtime budget receipt
        if: ${{ always() && steps.runtime_budget.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: zenpi-runtime-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zenpi-runtime-budget-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Check two-mode boundary
        run: python3 tools/check_modes.py

      - name: Exercise headless JSONL protocol
        run: cargo build --features dev-fixtures && ZENPI_BIN=target/debug/zenpi tools/headless_smoke.sh

      - name: Exercise the installed release user paths
        run: ZENPI_SMOKE_FEATURES=dev-fixtures python3 tools/user_smoke.py

      - name: Exercise the release headless protocol
        run: cargo build --release --features dev-fixtures && ZENPI_BIN=target/release/zenpi tools/headless_smoke.sh --release

      - name: Package and verify the production artifact
        run: |
          tools/release.sh
          (cd dist && shasum -a 256 -c *.sha256)
          contents=$(mktemp)
          trap 'rm -f "$contents"' EXIT
          for archive in dist/*.tar.gz; do
            if ! tar -tzf "$archive" > "$contents"; then
              echo "Unable to read production archive: $archive" >&2
              exit 1
            fi
            if grep -Eiq '(auth\.json|\.codex|\.zenpi|fixture|\.env)' "$contents"; then
              echo "Forbidden entry in production archive: $archive" >&2
              exit 1
            else
              match_status=$?
              if [ "$match_status" -ne 1 ]; then
                echo "Unable to check production archive entries: $archive" >&2
                exit "$match_status"
              fi
            fi
          done

  stage1-host:
    name: Release host bounds and G-LOAD(200)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the production release binary
        run: cargo build --release --locked

      - name: Run the Stage 1 host bounds and restart test
        run: cargo test --locked --test stage1_host

      # G-TASK runs inside the verify job's full test matrix (tests/tasks.rs,
      # tests/tasks_headless.rs, tests/tui_task.rs). G-LOAD(200) needs the
      # release binary built above.
      - name: Run G-LOAD(200)
        run: |
          mkdir -p Docs/quality/load
          python3 tools/load_agents.py --agents 200 --report Docs/quality/load/g-load-200.json

      - name: Upload Stage 1 host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: Docs/quality/load/g-load-200.json
          if-no-files-found: warn

  android:
    name: Android unit tests, lint, and Rust interop (G-ANDROID)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Portrait screenshot goldens (ZE-519) are recorded on macOS; the
      # comparison tolerates 1% of pixels for Linux font rendering.
      - name: Run Android JVM unit tests, lint and screenshot checks
        working-directory: android
        run: ./gradlew --console=plain :app:testDebugUnitTest lint verifyRoborazziDebug

      - name: Run Rust/Kotlin interop tests (remote_android_*_interop, --features remote)
        run: tools/build_android_interop_classes.sh --run

      - name: Upload Android test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: warn

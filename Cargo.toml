[package]
name = "zenpi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Rust agent with TUI and headless JSONL modes"
license = "MIT"
repository = "https://github.com/weiyangzen/zenpi"
readme = "README.md"
keywords = ["agent", "tui", "headless", "jsonl", "rust"]

[features]
default = []
dev-fixtures = []
# Android/desktop remote host: TLS listener, pairing QR code and certificate
# generation. Off by default; the core binary never builds it.
remote = ["dep:rcgen", "dep:qrcode"]

[dependencies]
base64 = "0.23"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
getrandom = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
httpdate = "1.0"
ignore = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "=1.13.3"
ureq = { version = "3.4", default-features = true, features = ["json"] }
url = "2.5"
yaml_serde = "0.10"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
quircs = "0.10"
tempfile = "3.23"

[[example]]
name = "runtime_budget_probe"
path = "tools/runtime_budget_probe.rs"

# Also `include!`d by remote_security, so it cannot carry an inner `cfg`.
[[test]]
name = "remote_auth"
path = "tests/remote_auth.rs"
required-features = ["remote"]

[[example]]
name = "remote_qr_fixture"
path = "tools/remote_qr_fixture.rs"
required-features = ["remote"]

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"

# ZS1-131: fixed terminal reader reset; upstream 0.29.0 and features preserved.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
